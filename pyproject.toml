[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-analysis-agent"
version = "1.0.0"
description = "A production-oriented data analysis agent powered by LangChain, LangGraph and ReAct"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "langchain==1.3.14",
  "langgraph==1.2.9",
  "langchain-openai==1.3.5",
  "langchain-deepseek==1.1.0",
  "pandas>=2.3,<3.1",
  "numpy>=2.1,<3",
  "scipy>=1.15,<2",
  "scikit-learn>=1.6,<2",
  "plotly>=6.1,<7",
  "kaleido>=1.0,<2",
  "openpyxl>=3.1,<4",
  "xlrd>=2.0,<3",
  "pyarrow>=19,<26",
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "python-multipart>=0.0.20,<1",
  "langsmith>=0.4.25,<1",
  "python-dotenv>=1.0,<2",
  "typer>=0.16,<1",
  "rich>=14,<16",
  "keyring==25.7.0",
  "boto3>=1.40,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
  "httpx>=0.28,<1",
]
deploy = [
  "langgraph-cli[inmem]>=0.4,<1",
]

[project.scripts]
data-agent = "data_agent.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
data_agent = ["echarts_engine.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# UP041: 保留 asyncio.TimeoutError 以兼容 Python 3.10（asyncio.TimeoutError
# 与内置 TimeoutError 在 3.11+ 才统一为同一类型）。
ignore = ["E501", "UP041"]

[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-analysis-agent"
version = "1.0.0"
description = "A production-oriented data analysis agent powered by LangChain, LangGraph and ReAct"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "langchain==1.4.2",
  "langgraph==1.2.12",
  "langchain-openai==1.6.6",
  "langchain-deepseek==1.1.1",
  "pandas>=3.0.6,<3.1",
  "numpy>=2.4.6,<3",
  "scipy>=1.17.1,<2",
  "scikit-learn>=1.9.1,<2",
  "plotly>=7.1.0,<8",
  "kaleido>=1.4.0,<2",
  "openpyxl>=3.1.5,<4",
  "xlrd>=2.0.2,<3",
  "pyarrow>=25.0.1,<26",
  "pdfplumber>=0.11.10,<1",
  "python-docx>=1.2.0,<2",
  "psutil>=7.2.2,<8",
  "fastapi>=0.141.1,<1",
  "uvicorn[standard]>=0.54.0,<1",
  "python-multipart>=0.0.32,<1",
  "langsmith>=0.14.0,<1",
  "python-dotenv>=1.2.3,<2",
  "typer>=0.27.2,<1",
  "rich>=15.0.0,<16",
  "keyring==25.7.0",
  "boto3>=1.43.102,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1,<10",
  "pytest-cov>=7.1.0,<8",
  "pytest-timeout>=2.4.0,<3",
  "pytest-xdist>=3.8.0,<4",
  "ruff>=0.16.9,<0.17",
  "httpx>=0.28.1,<1",
  # test_e2e_data_types.py::test_pdf_file_load 用 reportlab 生成真实 PDF 文件；
  # 不在运行时依赖里，仅测试需要。
  "reportlab>=5.0.1,<6",
  # 本地开发环境默认包含 Postgres 驱动，CI 的 Postgres service 依赖它跑集成测试。
  "psycopg[binary]>=3.3.6,<4",
  # 本地开发环境默认包含 MCP SDK，CI 依赖它做 MCP 服务的协议互操作测试。
  "mcp>=1.30.0,<2",
]
# 数据库查询工具的 Postgres 驱动：按需安装（pip install ".[postgres]"），
# 未安装时 query_database 会给出可操作的中文提示而不是裸 ImportError。
postgres = [
  "psycopg[binary]>=3.3.6,<4",
]
# MCP 数据面服务：按需安装（pip install ".[mcp]"）。
mcp = [
  "mcp>=1.30.0,<2",
]
deploy = [
  "langgraph-cli[inmem]>=0.4.32,<1",
]

[project.scripts]
data-agent = "data_agent.cli:app"
data-agent-mcp = "data_agent.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
data_agent = ["echarts_engine.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings"
# 单测超时保护：CI 上曾有无超时的测试挂起（外网/LLM 调用不 fail-fast）导致流水线卡死。
# 240s 的依据：本机最慢的合法用例是"首次导入 LLM 栈并构造客户端"（实测 17~26s，
# 属导入开销而非用例逻辑），CI runner 还要慢几倍；先前 120s 会把这类用例误杀，
# 且超时恰好在格式化另一个失败时触发，xdist 只回报 INTERNALERROR、看不到测试名。
# timeout_method="thread" 让超时以普通失败形式报出用例名，便于下次直接定位。
timeout = 240
timeout_method = "thread"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# UP041: 保留 asyncio.TimeoutError 以兼容 Python 3.10（asyncio.TimeoutError
# 与内置 TimeoutError 在 3.11+ 才统一为同一类型）。
ignore = ["E501", "UP041"]

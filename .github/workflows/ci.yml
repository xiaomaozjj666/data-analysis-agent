name: CI

on:
  push:
    branches: [main]
  pull_request:

# 最小权限：CI 只读仓库内容（不推送、不发版），降低 workflow 被注入后的影响面。
permissions:
  contents: read

# 仅对 PR 取消旧运行（PR 分支会反复推送，取消可避免排队）；
# 推送默认分支不取消——公开仓库的 Actions 分钟数免费，取消节省不了额度，
# 反而会让被顶掉的那次运行在提交列表里留下红色的 cancelled 标记。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # 一个版本失败时不取消其余版本，便于一次看到全部兼容性结论。
      fail-fast: false
      matrix:
        # requires-python >=3.11,<3.14：三个版本都由本工作流实测。
        python-version: ["3.11", "3.12", "3.13"]
    # Postgres service：让 query_database 的 Postgres 驱动在 CI 里跑真实集成测试，
    # 而不是只测"没装驱动时报错"这一条降级路径。测试自身在连不上时自动跳过，
    # 本地无 Docker 的环境不受影响。
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: analytics
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        # Python 3.11 的 ensurepip 自带旧版 setuptools（构建工具，非运行时依赖），
        # 先升级 pip/setuptools 到已修复版本，避免依赖审计被宿主工具误报。
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e ".[dev]"

      - name: Audit dependencies
        # pip-audit 没有 npm audit 的 --audit-level 选项；默认行为是发现任何
        # 已知漏洞即非零退出，比只拦 high 更严格。
        run: |
          python -m pip install pip-audit
          pip-audit

      - name: Lint with ruff
        run: ruff check .

      - name: Security scan (bandit)
        # 静态安全扫描：只拦 High 严重度（SQL 注入、命令注入、硬编码密钥等）。
        # Medium 中包含大量已知可接受的低风险模式（如内部 sqlite 参数化查询、
        # 内网回环地址），留作周期评审而非阻塞合并。
        run: |
          python -m pip install bandit
          bandit -r src/data_agent -lll -q

      - name: Type check (mypy, entire data_agent package)
        # 从 5 个核心文件扩大到整个 src/data_agent。宽松基线与历史错误码
        # 统一维护在 pyproject.toml，本地和 CI 使用完全相同的配置。
        run: |
          python -m pip install mypy
          python -m mypy src/data_agent

      - name: Run tests
        # kaleido 无头渲染在 CI 上偶发挂起且无法被信号超时中断；
        # 显式跳过真实 PNG 渲染分支（降级路径仍由 503/500 测试覆盖）。
        # -n 4：按 runner vCPU 并行分片，将全量 ~23min 压缩到 ~6min；
        # pytest-timeout=240 仍按 worker 兜底拦截挂起用例。
        # 注意：不要用 -n auto——本机多核会瞬时拉起过多 worker 触发 OpenBLAS
        # 内存分配失败（见 test_registry_import_rejects_zero_concurrency 子进程），
        # 固定 4 路既匹配 CI runner 规格也避免本地/CI 行为漂移。
        # DATA_AGENT_DATABASE_URL 指向上面的 service，Postgres 集成测试据此连接。
        #
        # 覆盖率门禁：本项目此前"本地保持 100%"靠自觉，没有任何自动拦截，
        # 结果是 postgres_source / mcp_server 等模块悄悄掉到 34% / 84% 也没人发现。
        # 阈值取 CI 实测值（98.10%）向下留 1 个点：CI 有真实 Postgres，
        # 覆盖率高于本地无库环境；留余量是为了容忍"某个外部服务偶发跳过"这类
        # 环境抖动，同时仍能拦住"整块测试被删/模块失去覆盖"的回退。
        env:
          DATA_AGENT_SKIP_KALEIDO: "1"
          DATA_AGENT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/analytics
        run: |
          python -m pytest -n 4 \
            --cov=data_agent --cov-report=term-missing --cov-report=xml \
            --cov-fail-under=97

  eval:
    name: Agent eval (offline deterministic gate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e .

      - name: Run offline Agent eval gate
        # 脚本化模型驱动真实 LangGraph/工具链；8 条必须全部通过。
        # 不读取真实 LLM Key，不访问外部模型 API；非零退出直接使 job 失败。
        env:
          LANGSMITH_TRACING: "false"
          DEEPSEEK_API_KEY: ""
          OPENAI_API_KEY: ""
        run: |
          data-agent-eval run-offline \
            --suite eval/examples/suite.json \
            --output "$RUNNER_TEMP/offline-results.jsonl" \
            --min-cases 8 \
            --min-accuracy 1.0

  frontend:
    name: Frontend (typecheck + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

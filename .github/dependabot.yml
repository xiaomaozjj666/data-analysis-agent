version: 2
updates:
  # Python 依赖（pyproject.toml）。dev extra 单独成组，避免测试工具淹没运行时依赖。
  # numpy / scipy 的自动更新会在更新器生成新文件时抛 unknown_error（2026-09-28、
  # 10-04、10-11 连续三周同一签名，同批其余依赖均正常）——dependabot 上游问题，
  # 本地无从规避；保留继续尝试，这两包平时靠手动批量升级跟进。
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    groups:
      python-runtime:
        patterns:
          - "*"
        exclude-patterns:
          - "pytest*"
          - "ruff*"
          - "reportlab*"
          - "psycopg*"
      python-dev:
        patterns:
          - "pytest*"
          - "ruff*"
          - "reportlab*"
          - "psycopg*"
    labels:
      - dependencies

  # 前端依赖（frontend/package.json，Vite + React）
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    groups:
      npm-frontend:
        patterns:
          - "*"
    labels:
      - dependencies
      - frontend

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - dependencies
      - ci

services:
  - type: web
    name: data-analysis-agent
    # 必须用 runtime：它是 Render schema 的 required 字段；env 不是合法字段，
    # 出现即触发 additionalProperties:false 校验失败，整个 blueprint 无法同步。
    runtime: python
    # 线上为 Free 实例；显式声明，避免默认值歧义。
    plan: free
    buildCommand: |
      cd frontend && npm ci && npm run build && cd ..
      pip install .
    startCommand: uvicorn data_agent.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    # 不声明 region：它是不可变字段，声明值与服务现状不一致时 sync 会失败。
    # 不声明 disk：Free 档不支持持久磁盘；/var/data 是容器临时层，重启即清空。
    # 需要持久化时升级到 Starter 及以上，并在本服务下加回：
    #   disk:
    #     name: data
    #     mountPath: /var/data
    #     sizeGB: 10
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATA_AGENT_DATA_DIR
        value: /var/data
      - key: DATA_AGENT_STATIC_DIR
        value: frontend/dist
      - key: DATA_AGENT_CORS_ORIGINS
        value: "https://data-analysis-agent-wikz.onrender.com"
      - key: APP_ACCESS_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # 默认 provider 为 deepseek（config.py：provider=deepseek / model=deepseek-flash）。
      # Render 会忽略对已有 Blueprint 的 sync:false 变量，已有服务需在 dashboard 手动补值。
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-flash
      - key: DATA_AGENT_STORAGE_BACKEND
        value: local
    autoDeploy: true

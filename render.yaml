services:
  - type: web
    name: data-analysis-agent
    runtime: python
    plan: free
    buildCommand: pip install -e .
    startCommand: uvicorn data_agent.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: DATA_AGENT_RUNS_DIR
        value: /tmp/data-agent-runs
      - key: DATA_AGENT_CORS_ORIGINS
        value: "https://data-analysis-agent-wikz.onrender.com"
      - key: APP_ACCESS_TOKEN
        generateValue: true
      - key: DATA_AGENT_MAX_UPLOAD_BYTES
        value: "209715200"
      - key: DATA_AGENT_MAX_ROWS
        value: "1000000"
      - key: DATA_AGENT_MAX_CELLS
        value: "10000000"
      - key: DATA_AGENT_RATE_LIMIT_PER_MINUTE
        value: "30"
      - key: DATA_AGENT_MAX_CONCURRENT_ANALYSES
        value: "2"
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: LANGSMITH_TRACING
        value: "true"
      - key: LANGSMITH_API_KEY
        sync: false
      - key: LANGSMITH_PROJECT
        value: data-analysis-agent

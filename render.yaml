services:
  - type: web
    name: data-analysis-agent
    env: python
    region: singapore
    buildCommand: |
      cd frontend && npm ci && npm run build && cd ..
      pip install .
    startCommand: uvicorn data_agent.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATA_AGENT_DATA_DIR
        value: /var/data
      - key: DATA_AGENT_STATIC_DIR
        value: frontend/dist
      - key: DATA_AGENT_CORS_ORIGINS
        value: "*"
      - key: OPENAI_API_KEY
        sync: false
      - key: DATA_AGENT_STORAGE_BACKEND
        value: local
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 10
    autoDeploy: true

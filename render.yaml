services:
  - type: web
    name: data-analysis-agent
    env: python
    region: singapore
    buildCommand: |
      cd frontend && npm ci && npm run build && cd ..
      pip install .
    startCommand: uvicorn data_agent.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATA_AGENT_DATA_DIR
        value: /var/data
      - key: DATA_AGENT_STATIC_DIR
        value: frontend/dist
      - key: DATA_AGENT_CORS_ORIGINS
        value: "https://your-frontend-domain.onrender.com"
      - key: APP_ACCESS_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # 默认 provider 为 deepseek（config.py：provider=deepseek / model=deepseek-flash），
      # 按 README 默认链路部署时填 DEEPSEEK_API_KEY；OPENAI_API_KEY 留给 OpenAI 兼容中转。
      # 注意 Render 规则（blueprint-spec 文档）：更新已有 Blueprint 时 sync:false 的变量
      # 会被忽略——首次创建时才会提示填值；已有服务要生效必须在 Render dashboard 手动添加。
      - key: DEEPSEEK_API_KEY
        sync: false
      # 模型名不是机密，直接带默认值（与 config.py / .env.example 一致），
      # 让 blueprint 更新真正生效而不是被 sync:false 忽略
      - key: DEEPSEEK_MODEL
        value: deepseek-flash
      - key: DATA_AGENT_STORAGE_BACKEND
        value: local
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 10
    autoDeploy: true
